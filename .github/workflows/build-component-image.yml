name: Build EE Component Image

on:
  push:
    branches-ignore:
      - main
      - master
      - docker-build
      - dev
      - v**
  workflow_dispatch:
    inputs:
      branch:
        description: Branch, tag, or commit SHA to build
        required: true
        default: dev
        type: string
      tag:
        description: Docker image tag
        required: true
        default: dev-manual
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: component-${{ inputs.tag || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref_type == 'branch' &&
       github.ref_name != 'main' && github.ref_name != 'master' &&
       github.ref_name != 'docker-build' && github.ref_name != 'dev' &&
       !startsWith(github.ref_name, 'v'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      sources: ${{ steps.source.outputs.sources }}
      source_sha: ${{ steps.source.outputs.sha }}
      image_tag: ${{ steps.metadata.outputs.tag }}
    env:
      ALIYUN_ENABLED: ${{ secrets.ALIYUN_REGION != '' && secrets.ALIYUN_USERNAME != '' && secrets.ALIYUN_PASSWORD != '' }}
      SOURCE_BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.ref_name }}
      SOURCE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.sha }}
      REQUESTED_TAG: ${{ inputs.tag }}

    steps:
      - name: Check out build configuration
        uses: actions/checkout@v4
        with:
          ref: docker-build
          fetch-depth: 1

      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}
          path: source
          fetch-depth: 1

      - name: Record source for build notification
        id: source
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git -C source rev-parse HEAD)"
          sources="$(jq -nc --arg repository "${GITHUB_REPOSITORY}" \
            --arg branch "${SOURCE_BRANCH}" --arg ref "${sha}" \
            '{($repository): {branch: $branch, ref: $ref}}')"
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"
          echo "sources=${sources}" >> "${GITHUB_OUTPUT}"

      - name: Prepare tag
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${REQUESTED_TAG}" ]; then
            raw_tag="${REQUESTED_TAG}"
          else
            timestamp="$(TZ=Asia/Shanghai date +'%Y%m%d-%H%M%S')"
            raw_tag="${SOURCE_BRANCH}-${timestamp}"
          fi

          tag="$(
            printf '%s' "${raw_tag}" |
              tr '[:upper:]' '[:lower:]' |
              sed -E 's/[^a-z0-9_.-]+/-/g; s/^[.-]+//; s/[.-]+$//' |
              cut -c1-128
          )"

          if [ -z "${tag}" ]; then
            echo "Image tag is empty after normalization." >&2
            exit 1
          fi

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push EE image
        uses: docker/bake-action@v6
        env:
          TAG: ${{ steps.metadata.outputs.tag }}
        with:
          source: .
          files: .github/docker-bake.hcl
          targets: ee
          push: true
          provenance: false
          sbom: false
          set: "*.platform=linux/amd64"

      - name: Push to Aliyun
        if: env.ALIYUN_ENABLED == 'true'
        shell: bash
        env:
          ALIYUN_REGION: ${{ secrets.ALIYUN_REGION }}
          IMAGE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          set -euo pipefail

          echo "${{ secrets.ALIYUN_PASSWORD }}" | docker login --username ${{ secrets.ALIYUN_USERNAME }} ${{ secrets.ALIYUN_REGION }} --password-stdin
          docker pull "ghcr.io/jumpserver-east/${GITHUB_REPOSITORY#*/}:${IMAGE_TAG}"
          docker tag "ghcr.io/jumpserver-east/${GITHUB_REPOSITORY#*/}:${IMAGE_TAG}" "${ALIYUN_REGION}/fit2cloud_nickyang0_0/${GITHUB_REPOSITORY#*/}:${IMAGE_TAG}"
          docker push "${ALIYUN_REGION}/fit2cloud_nickyang0_0/${GITHUB_REPOSITORY#*/}:${IMAGE_TAG}"

      - name: Verify GHCR package is private
        shell: bash
        run: |
          set -euo pipefail

          status="$(
            curl --silent --output /dev/null --write-out '%{http_code}' \
              "https://ghcr.io/token?scope=repository%3Ajumpserver-east%2F${GITHUB_REPOSITORY#*/}%3Apull"
          )"

          if [ "${status}" != "401" ]; then
            echo "Expected private GHCR package, anonymous token request returned HTTP ${status}." >&2
            exit 1
          fi

      - name: Publish summary
        shell: bash
        env:
          ALIYUN_REGION: ${{ secrets.ALIYUN_REGION }}
        run: |
          {
            echo "### EE component image"
            echo
            echo "Branch: \`${SOURCE_BRANCH}\`"
            echo
            echo "GHCR: \`ghcr.io/jumpserver-east/${GITHUB_REPOSITORY#*/}:${{ steps.metadata.outputs.tag }}\`"
            echo
            if [ "${ALIYUN_ENABLED}" = "true" ]; then
              echo "Aliyun: \`${ALIYUN_REGION}/fit2cloud_nickyang0_0/${GITHUB_REPOSITORY#*/}:${{ steps.metadata.outputs.tag }}\`"
            else
              echo "Aliyun: skipped (secrets are not configured)"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

  notify:
    needs: build
    if: ${{ always() && needs.build.result != 'skipped' }}
    uses: jumpserver-east/docker-web/.github/workflows/notify-image-build.yml@docker-build
    permissions:
      contents: read
    with:
      result: ${{ needs.build.result }}
      image: ${{ format('ghcr.io/{0}:{1}', github.repository, needs.build.outputs.image_tag || inputs.tag || 'not-generated') }}
      source_repository: ${{ github.repository }}
      source_branch: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.ref_name }}
      source_ref: ${{ needs.build.outputs.source_sha || (github.event_name == 'workflow_dispatch' && inputs.branch || github.sha) }}
      sources: ${{ needs.build.outputs.sources || '{}' }}
      actor: ${{ github.triggering_actor || github.actor }}
      event: ${{ github.event_name }}
    secrets:
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      MAIL_RECIPIENTS_JSON: ${{ secrets.MAIL_RECIPIENTS_JSON }}
