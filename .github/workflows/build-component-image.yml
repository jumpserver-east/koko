name: Build EE Component Image

on:
  create:
  workflow_run:
    workflows:
      - JumpServer repos generic handler
    types:
      - completed
  workflow_dispatch:
    inputs:
      branch:
        description: Branch, tag, or commit SHA to build
        required: true
        default: dev
        type: string
      tag:
        description: Docker image tag
        required: true
        default: dev-manual
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: component-${{ inputs.tag || github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'create' && github.event.ref_type == 'branch') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    uses: jumpserver-east/docker-web/.github/workflows/reusable-component-image.yml@docker-build
    with:
      source_ref: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.event.workflow_run.head_sha || github.event.ref }}
      source_branch: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.event.workflow_run.head_branch || github.event.ref }}
      image_tag: ${{ inputs.tag }}
    secrets: inherit
