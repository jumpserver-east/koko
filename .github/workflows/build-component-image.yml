name: Build Component Image to GHCR

on:
  create:
  workflow_run:
    workflows:
      - JumpServer repos generic handler
    types:
      - completed
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit SHA to build
        required: true
        default: dev
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: component-${{ github.event.workflow_run.head_sha || inputs.ref || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'create' && github.event.ref_type == 'branch') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Resolve source revision
        id: source
        shell: bash
        env:
          CREATE_REF: ${{ github.event.ref }}
          MANUAL_REF: ${{ inputs.ref }}
          WORKFLOW_RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          case "${GITHUB_EVENT_NAME}" in
            workflow_run)
              source_ref="${WORKFLOW_RUN_SHA}"
              source_branch="${WORKFLOW_RUN_BRANCH}"
              ;;
            create)
              source_ref="${CREATE_REF}"
              source_branch="${CREATE_REF}"
              ;;
            workflow_dispatch)
              source_ref="${MANUAL_REF}"
              source_branch="${MANUAL_REF}"
              ;;
          esac

          echo "ref=${source_ref}" >> "${GITHUB_OUTPUT}"
          echo "branch=${source_branch}" >> "${GITHUB_OUTPUT}"

      - name: Check out source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.ref }}
          fetch-depth: 1

      - name: Prepare image metadata
        id: image
        shell: bash
        env:
          SOURCE_BRANCH: ${{ steps.source.outputs.branch }}
        run: |
          set -euo pipefail

          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          repository="$(printf '%s' "${GITHUB_REPOSITORY#*/}" | tr '[:upper:]' '[:lower:]')"
          branch_tag="$(
            printf '%s' "${SOURCE_BRANCH}" |
              tr '[:upper:]' '[:lower:]' |
              sed -E 's/[^a-z0-9_.-]+/-/g; s/^[.-]+//; s/[.-]+$//' |
              cut -c1-100
          )"
          revision="$(git rev-parse HEAD)"
          timestamp="$(TZ=Asia/Shanghai date +'%Y%m%d-%H%M%S')"

          if [ -z "${branch_tag}" ]; then
            branch_tag="revision"
          fi

          tag="${branch_tag}-${timestamp}"

          {
            echo "image=ghcr.io/${owner}/${repository}"
            echo "repository=${repository}"
            echo "revision=${revision}"
            echo "tag=${tag}"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ vars.DOCKER_PLATFORMS || 'linux/amd64' }}
          push: true
          provenance: false
          build-args: |
            VERSION=${{ steps.image.outputs.tag }}
          tags: ${{ steps.image.outputs.image }}:${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.title=${{ steps.image.outputs.repository }}
            org.opencontainers.image.revision=${{ steps.image.outputs.revision }}
            org.opencontainers.image.version=${{ steps.image.outputs.tag }}
          cache-from: type=gha,scope=${{ steps.image.outputs.repository }}
          cache-to: type=gha,mode=max,scope=${{ steps.image.outputs.repository }}

      - name: Publish summary
        shell: bash
        run: |
          {
            echo "### GHCR component image"
            echo
            echo "Source branch: \`${{ steps.source.outputs.branch }}\`"
            echo
            echo "Source revision: \`${{ steps.image.outputs.revision }}\`"
            echo
            echo "Image: \`${{ steps.image.outputs.image }}:${{ steps.image.outputs.tag }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
